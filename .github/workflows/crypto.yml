name: Update Kaggle Crypto Data Hourly
on:
  workflow_dispatch:

concurrency:
  group: update-crypto-kg
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  get_and_upload_crypto_data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Download existing Kaggle Dataset
      uses: nick-fields/retry@v3
      env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 15
        retry_on: error
        command: kaggle datasets download -d adrianjuliusaluoch/hourly-crypto-stocks-market-data -p storage --unzip --force
    - name: Run update script
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 15
        retry_on: error
        command: python crypto.py
    - name: Update Kaggle Dataset
      uses: nick-fields/retry@v3
      env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 15
        retry_on: error
        command: kaggle datasets version -p storage -m "Automatic Update"
